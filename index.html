<html>
<head>
    <title>Login Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
        }
        .container {
            display: flex;
            width: 80%;
            height: 80%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .left {
            background: rgba(0, 128, 0, 0.8);
            color: white;
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: url('https://unsplash.com/photos/five-human-hands-on-brown-surface-LjqARJaJotc');
            background-size: cover;
            background-blend-mode: overlay;
        }
        .left h1 {
            font-size: 48px;
            margin: 0;
        }
        .left p {
            font-size: 24px;
            margin: 10px 0;
        }
        .left .underline {
            width: 50px;
            height: 4px;
            background-color: white;
            margin-top: 10px;
        }
        .right {
            background: white;
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .right .form-container {
            width: 80%;
        }
        .right h2 {
            color: #008000;
            font-size: 32px;
            margin-bottom: 10px;
            text-align: center;
        }
        .right p {
            color: #666;
            text-align: center;
            margin-bottom: 20px;
        }
        .right input[type="text"], .right input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #008000;
            border-radius: 5px;
        }
        .right input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #008000;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .right .signup {
            text-align: center;
            margin-top: 20px;
        }
        .right .signup a {
            color: #008000;
            text-decoration: none;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #666;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left">
            <h1>Disaster</h1>
            <p>Survive a Disaster For Donor And Recipient</p>
            <div class="underline"></div>
        </div>
        <div class="right">
            <div class="form-container">
                <h2>Login</h2>
                <p>To Your Account</p>
                <form>
                    <input type="text" placeholder="Email id">
                    <input type="password" placeholder="Password">
                    <input type="submit" value="Login">
                </form>
                <div class="signup">
                    <p>Don't have an account? <a href="#">Sign up</a></p>
                </div>
            </div>
        </div>
    </div>
    <button class="close-btn">&times;</button>
</body>
</html>
